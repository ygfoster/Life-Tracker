<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Life Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life Tracker">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <!-- キャッシュ強制更新 v9 -->
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div class="app-container">
    <main id="main-content" class="viewport">
      <div id="swipe-wrapper" class="swipe-wrapper">
        <section id="view-life" class="view-section">
          <h1 class="view-title">私の寿命</h1>
          <div class="timer-display" id="timer-life"></div>
        </section>
        <section id="view-born" class="view-section">
          <h1 class="view-title">私が生まれてから</h1>
          <div class="timer-display" id="timer-born"></div>
        </section>
        <section id="view-custom-empty" class="view-section">
          <h1 class="view-title">未設定</h1>
          <div class="empty-custom-msg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <p>設定画面から<br>カスタムタイマーを追加してください</p>
          </div>
        </section>
        <section id="view-settings" class="view-section scrollable">
          <h1 class="view-title">Settings</h1>
          <div class="settings-form">
            <div class="form-group">
              <label>生まれた日付</label>
              <div class="date-picker-group" id="picker-birth"></div>
              <div class="error-msg" id="error-birth">未来の日付は選択できません</div>
            </div>
            <div class="form-group">
              <label>寿命</label>
              <div id="input-life-wrap"></div>
            </div>
            <hr class="divider">
            <div class="form-header-row">
              <label>カスタム設定 (最大3件)</label>
              <button id="btn-add-custom" class="btn-text">+ 追加</button>
            </div>
            <div id="custom-settings-list" class="custom-settings-list"></div>
            <button id="btn-save-settings" class="btn-primary" style="margin-top: 32px;">保存して反映</button>
          </div>
        </section>
      </div>
    </main>
    <div class="custom-indicators" id="custom-indicators"></div>
    <nav class="floating-tab-bar" id="bottom-nav">
      <button class="tab-item active" data-tab="view-life">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Life</span>
      </button>
      <button class="tab-item" data-tab="view-born">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Born</span>
      </button>
      <button class="tab-item" data-tab="view-custom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg><span>Custom</span>
      </button>
      <button class="tab-item" data-tab="view-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Setting</span>
      </button>
    </nav>
  </div>
  <!-- キャッシュ強制更新 v9 -->
  <script src="app.js?v=9"></script>
</body>
</html>
